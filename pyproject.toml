[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waferbot"
version = "0.3.6"
description = "PID-only line follower for the Yahboom Raspbot V2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
waferbot = "waferbot.cli:main"

[project.optional-dependencies]
# Only needed on the Raspberry Pi itself. The package imports cleanly without it.
hardware = ["smbus2>=0.4.2"]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
